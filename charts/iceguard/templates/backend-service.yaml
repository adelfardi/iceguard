apiVersion: v1
kind: Service
metadata:
  name: {{ include "iceguard.backend.fullname" . }}
  labels:
    {{- include "iceguard.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with (merge (dict) .Values.backend.service.annotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.backend.service.type "NodePort") .Values.backend.service.nodePort }}
      nodePort: {{ .Values.backend.service.nodePort }}
      {{- end }}
  selector:
    {{- include "iceguard.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
