{{- range $component := list "backend" "frontend" }}
{{- $cfg := index $.Values $component }}
{{- if and $cfg.podDisruptionBudget.enabled (gt (int $cfg.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include (printf "iceguard.%s.fullname" $component) $ }}
  labels:
    {{- include "iceguard.labels" (dict "ctx" $ "component" $component) | nindent 4 }}
spec:
  minAvailable: {{ $cfg.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "iceguard.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
