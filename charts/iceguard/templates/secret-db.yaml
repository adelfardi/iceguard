{{- $db := .Values.database -}}
{{- if not (or $db.host $db.jdbcUrl) }}
  {{- fail "database.host (or database.jdbcUrl) is required — IceGuard needs a PostgreSQL you provide" }}
{{- end }}
{{- if not (or $db.password $db.existingSecret) }}
  {{- fail "database.password or database.existingSecret is required" }}
{{- end }}
{{- if not $db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db" (include "iceguard.fullname" .) }}
  labels:
    {{- include "iceguard.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  username: {{ $db.username | quote }}
  {{ include "iceguard.db.passwordKey" . }}: {{ $db.password | quote }}
{{- end }}
