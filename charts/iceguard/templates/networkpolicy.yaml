{{- if .Values.networkPolicy.enabled }}
# Ingress-only policy. Egress is deliberately unrestricted: the backend has to reach the
# database plus whatever Iceberg catalogs and object stores the user registers at runtime.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iceguard.backend.fullname" . }}
  labels:
    {{- include "iceguard.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iceguard.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "iceguard.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 14 }}
        {{- if .Values.tests.enabled }}
        # `helm test` pod — it curls the backend directly.
        - podSelector:
            matchLabels:
              {{- include "iceguard.selectorLabels" (dict "ctx" . "component" "test") | nindent 14 }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    {{- with .Values.networkPolicy.backendExtraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
